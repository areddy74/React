version: 0.2

env:
  variables:
    projectName: CounterApp
    mavenGoal: install

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - apt update && apt -y install tree
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - npm run build --if-present
      - ls -lart
      - npm test -- --ci --watchAll=false
      - node -v
  post_build:
    commands:
      - npm run test:e2e || echo "Skipping e2e"

artifacts:
  files:
    - '**/*'
  base-directory: build
  discard-paths: no

