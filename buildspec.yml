version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
  build:
    commands:
      - echo "Starting build..."
      - npm run build --if-present
      - ls -lart
      - node -v

artifacts:
  files:
    - '**/*'
  base-directory: build
  discard-paths: no
